# EXAMPLE ONLY. This file is not active: GitHub runs workflows only from .github/workflows/.
# To use it in your own repository, copy it to .github/workflows/eval-gate.yml and adjust the paths.
#
# Tier 1 (every push and PR): the offline gate on recorded results. Free, deterministic, no secrets.
# Tier 2 (nightly, or by hand before a release): a live, uncached run that records fresh results,
#          then applies the same gate. It needs an API key stored as a repository secret.
#
# Triggers and schedule behavior: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
#   - cron runs in UTC on the latest commit of the default branch
#   - pick an odd minute: runs at the top of the hour are more likely to be delayed
#   - in public repositories, scheduled workflows are disabled after 60 days without activity

name: eval-gate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "config/models.json"
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Unit tests for the statistics and the gate
        run: pytest evals/test_compare_gate.py -q
      - name: Gate the recorded candidate against the recorded baseline
        # Exit code 1 fails the job, which blocks the merge when branch protection requires this check.
        run: >-
          python evals/compare_gate.py
          evals/results/baseline.json evals/results/candidate.json
          --config evals/gate_config.json

  live-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install anthropic pytest
      - name: Run the suite live, cache disabled, 3 trials per question
        # run_suite.py is your own runner (not part of this lab). It should write per-question
        # results in the same JSON shape as fixtures/*.json, plus a manifest of model ids,
        # prompt and dataset hashes, grader versions, settings, and the cache hit rate.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python evals/run_suite.py --no-cache --trials 3
          --out evals/results/nightly.json
      - name: Gate tonight's run against the stored baseline
        run: >-
          python evals/compare_gate.py
          evals/results/baseline.json evals/results/nightly.json
          --config evals/gate_config.json
      - name: Keep the results and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-results
          path: evals/results/
