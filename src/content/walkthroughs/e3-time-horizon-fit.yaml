id: e3-time-horizon-fit
summary: |
  This program computes an agent's "time horizon": the length of task (measured in how long it takes a human) at which the agent succeeds with a given probability. It fits a logistic regression of success on log2 of task length by plain gradient ascent, then inverts the fitted curve to find the task length where the success probability hits 50% or 80%.

  The fit and the inversion are separate functions. The fit is the statistical model; the horizon is a summary read off it. Keeping them apart makes it easy to see that the 50% and 80% horizons come from the same curve, and that the gap between them is set by the fitted slope, which is exactly what people leave out when they quote a single horizon.
code: |
  import math

  # Success data for one agent: (human task minutes, 1 if the agent succeeded else 0).
  # Each task was attempted several times; each attempt is one row.
  RUNS = (
      [(2, 1)] * 8 +
      [(8, 1)] * 7 + [(8, 0)] * 1 +
      [(30, 1)] * 5 + [(30, 0)] * 3 +
      [(120, 1)] * 3 + [(120, 0)] * 5 +
      [(480, 1)] * 1 + [(480, 0)] * 7
  )


  def fit_logistic(runs, steps=5000, lr=0.1):
      """Fit p(success) = sigmoid(a + b * log2(minutes)) by gradient ascent
      on the log-likelihood. Return (a, b)."""
      a, b = 0.0, 0.0
      n = len(runs)
      for _ in range(steps):
          grad_a = grad_b = 0.0
          for minutes, y in runs:
              x = math.log2(minutes)
              p = 1 / (1 + math.exp(-(a + b * x)))
              grad_a += y - p
              grad_b += (y - p) * x
          a += lr * grad_a / n
          b += lr * grad_b / n
      return a, b


  def horizon(a, b, p=0.5):
      """Human task length (minutes) at which the fitted success probability equals p."""
      x = (math.log(p / (1 - p)) - a) / b
      return 2 ** x


  a, b = fit_logistic(RUNS)
  print("50% horizon (min):", round(horizon(a, b, 0.5), 1))
  print("80% horizon (min):", round(horizon(a, b, 0.8), 1))
notes:
  - lines: [1, 11]
    title: The data, built by repeating rows
    text: |
      Each row is one attempt: `(minutes, y)` where `minutes` is how long the task takes a human and `y` is 1 for success, 0 for failure. This is the raw Bernoulli data a logistic regression wants, one outcome per trial, rather than pre-computed success rates.

      `[(2, 1)] * 8` uses **list repetition**: multiplying a list by an integer makes a list with that element repeated, here eight copies of the tuple `(2, 1)`. The `+` signs **concatenate** the pieces into one list of 48 rows. The outer parentheses just let the expression span several lines.

      Reading the counts: 8 of 8 at 2 minutes, 7 of 8 at 8 minutes, 5 of 8 at 30, 3 of 8 at 120, 1 of 8 at 480. Success falls steadily as tasks get longer, and task lengths grow by roughly a factor of four each step, which is why the model uses log2 of minutes.
  - lines: [14, 18]
    title: The model and the starting point
    text: |
      The docstring states the model: p(success) = sigmoid(a + b times log2(minutes)), where sigmoid(z) = 1 / (1 + e to the minus z). That is logistic regression with one predictor. `steps=5000` and `lr=0.1` are **default arguments**: the caller can override them, but doesn't have to.

      `a, b = 0.0, 0.0` is **tuple unpacking**, assigning two variables in one line. Starting at zero means the initial model predicts 50% for every task, a neutral start. `n = len(runs)` is saved so the gradient can be averaged rather than summed, which keeps the step size meaningful whatever the dataset size.
  - lines: [19, 25]
    title: One pass of the gradient
    text: |
      `for _ in range(steps):` repeats the update 5000 times. The underscore is a convention for "I don't need the loop counter".

      `grad_a = grad_b = 0.0` is **chained assignment**, setting both to zero at the start of each pass. Then, for every attempt, the code computes `x = log2(minutes)` and the model's current probability `p`, and accumulates two quantities: `y - p` and `(y - p) * x`.

      Those are exactly the partial derivatives of the Bernoulli log-likelihood. For one observation the log-likelihood is y log p + (1 minus y) log(1 minus p), and because the sigmoid's derivative is p(1 minus p), the chain rule collapses to (y minus p) for the intercept and (y minus p) times x for the slope. Each observation pushes the curve toward its own outcome, weighted by how wrong the current prediction is.

      `for minutes, y in runs:` unpacks each tuple into two names as it loops, which reads much better than `run[0]` and `run[1]`.
  - lines: [26, 28]
    title: Take a step uphill
    text: |
      `a += lr * grad_a / n` moves `a` a small step in the direction that increases the average log-likelihood. This is **gradient ascent** (we are maximizing likelihood), so the sign is plus. Flip it to minus and the parameters walk away from the maximum.

      After 5000 steps the parameters settle at about a = 4.16 and b = minus 0.694. The negative slope says success falls as tasks get longer: each doubling of task length lowers the log-odds of success by about 0.69.

      Why so many steps? Plain gradient ascent with a fixed step converges slowly, especially when x values are not centered (log2 minutes runs from 1 to about 9 here). With only 50 steps the fit stops early at a = 0.68, b = minus 0.15, and the 50% horizon comes out near 22 minutes instead of 63. An AI that "speeds this up" by cutting `steps` can produce a plausible-looking but wrong answer, so check convergence, for example by confirming that the parameters barely move over the last few hundred steps.
  - lines: [31, 34]
    title: Invert the curve to get a horizon
    text: |
      To find the task length where success probability equals `p`, set the model equal to `p` and solve. The sigmoid's inverse is the **logit**, log(p / (1 minus p)), so a + b x = logit(p), which gives x = (logit(p) minus a) / b. Since x is log2 of minutes, `2 ** x` converts back to minutes.

      Note that `math.log` here is the **natural** log, on purpose: the logit is defined with natural logs because the sigmoid uses e. The base-2 log belongs only to the predictor. Mixing these up is an easy mistake (see the review questions).

      At p = 0.5 the logit is 0, so x = minus a / b, about 5.99, and the horizon is 2 to the 5.99, about 63.5 minutes. At p = 0.8 the logit is about 1.386, so x is about 3.99 and the horizon is about 15.9 minutes.
  - lines: [37, 39]
    title: Two horizons from one curve
    text: |
      The demo fits once and prints both horizons: about 63.5 minutes at 50% and 15.9 minutes at 80%. They differ by a factor of four.

      That factor is not a separate measurement; it comes straight from the slope. The two x values differ by logit(0.8) / |b|, about 1.386 / 0.694, about 2 doublings, which is a factor of four in minutes. A flatter slope (a less sharp drop-off) would make the gap wider.

      So when someone quotes "a one-hour time horizon", the questions to ask are: at what success rate, and how steep is the curve? The same agent is reliable only on tasks a quarter that long.
review:
  - id: wt-thf-log-base
    type: code-reading
    prompt: An AI assistant rewrites `horizon` as below, reasoning that "the model uses log2, so the inverse should too." What happens to the two printed horizons?
    code: |
      def horizon(a, b, p=0.5):
          x = (math.log2(p / (1 - p)) - a) / b
          return 2 ** x
    options:
      - id: a
        text: Both horizons stay the same, because the base of a log only rescales it
        rationale: Rescaling the logit matters, because it is compared against `a` and `b`, which were fitted with natural-log odds.
      - id: b
        text: Both horizons change by the same factor
        rationale: At p = 0.5 the odds are 1, and the log of 1 is 0 in every base, so the 50% horizon cannot change.
      - id: c
        text: The 50% horizon is unchanged (about 63.5 min), but the 80% horizon drops to about 8.6 min instead of 15.9
        correct: true
        rationale: Right. log2(4) is 2 while ln(4) is about 1.386, so the 80% case solves for the wrong log-odds. The 50% case hides the bug because its logit is 0 in any base.
    explanation: This bug survives the hidden tests, which only check that the 80% horizon is several times shorter than the 50% one (8.6 is still less than 63.5 / 3). A bug that is invisible at the most common input, here p = 0.5, is the kind to look for when reviewing, and the reason to add a test at a second value with a known answer.
  - id: wt-thf-sign
    type: predict-output
    prompt: Suppose the update lines are changed to `a -= lr * grad_a / n` and `b -= lr * grad_b / n`. What happens?
    options:
      - id: a
        text: The fit converges to the same answer, just from the other side
        rationale: The sign decides whether each step goes uphill or downhill on the likelihood. Going downhill doesn't reach the same maximum.
      - id: b
        text: The parameters move away from the maximum-likelihood fit, toward predictions that are as wrong as possible, so the horizons become meaningless (and the slope comes out positive)
        correct: true
        rationale: Right. With minus signs this is gradient descent on the log-likelihood, which pushes the model to predict failure where the agent succeeded and success where it failed.
      - id: c
        text: It raises an error immediately
        rationale: The arithmetic is still valid Python. Nothing complains until a test checks the result.
    explanation: Ascent versus descent is a one-character difference that is easy to get wrong, especially when an AI adapts code written for minimizing a loss. The hidden test that `b < 0` is a cheap sanity check that catches this.
  - id: wt-thf-raw-rows
    type: scenario
    prompt: Why does the data list one row per attempt, rather than one row per task length with its success rate (for example `(30, 0.625)`)?
    options:
      - id: a
        text: Python can't do arithmetic on fractions like 0.625
        rationale: It can. The reason is statistical, not technical.
      - id: b
        text: Logistic regression is a model of individual binary outcomes, and per-attempt rows let the likelihood weight each task length by how many attempts it has
        correct: true
        rationale: Right. A row per attempt is the Bernoulli likelihood directly. Collapsing to rates would lose the counts unless you added them back as weights.
      - id: c
        text: It makes no difference to the fitted curve
        rationale: Here every length has 8 attempts, so a weighted fit on rates would match. With unequal counts, unweighted rates would treat 2 attempts the same as 200.
    explanation: Whenever you see success rates fed into a model, ask how many trials each rate came from. A rate from two attempts and a rate from two hundred carry very different evidence.
direct:
  task: |
    The horizon is a point estimate with no uncertainty attached. You want a rough interval for the 50% horizon by bootstrapping: resample the attempts with replacement, refit, and take percentiles.

    Write the prompt you'd give a coding assistant to make that change.
  prompt: |
    Add a function horizon_interval(runs, p=0.5, reps=200, seed=0) that returns (low, high), a 95% percentile bootstrap interval for horizon(a, b, p). Each replicate draws len(runs) rows with replacement using random.Random(seed), refits with fit_logistic, and computes the horizon. Sort the replicate horizons and return the 2.5th and 97.5th percentiles.

    Do not change fit_logistic or horizon (keep ascent with a plus sign, natural log in the logit, and the default steps and lr). Use only the standard library. Because each refit is 5000 steps, keep reps small by default and mention the runtime in the docstring.

    Add test asserts: the point estimate horizon from the full data lies inside the interval; the same seed gives the same interval twice; and low is strictly less than high. Print the 50% interval in the demo.
  checklist:
    - fit_logistic and horizon are untouched (same signs, same logs, same defaults)
    - Resampling draws whole (minutes, y) rows with replacement, not minutes and outcomes separately
    - The generator is a seeded random.Random, so results are repeatable
    - The point estimate falls inside the interval, and a test checks it
    - The default reps keeps the demo fast enough to run in the browser
