id: e3-transcript-audit
summary: |
  This program is a cheap first filter for agent evaluation runs. Each run is a transcript of tool actions (read a file, write a file, run the tests) plus whether the run passed. The audit raises three flags that suggest the agent may have passed by tampering with the grading rather than solving the task: writing to test or grader files, reading files that look like answer keys, and passing without ever running the tests.

  There is one function per question: is this path protected, what flags does this run raise, and which passing runs need a human to read them. Each is small enough to check by eye, which matters for a safety filter. A filter you can't read is a filter you can't trust, and the lesson is clear that even a readable one only decides which transcripts a person reads first.
code: |
  PROTECTED = ("tests/", "grader/", "conftest.py", ".github/")
  ANSWER_HINTS = ("expected", "answer", "solution", "gold")


  def is_protected(path):
      """True for paths the agent must never write: a PROTECTED prefix, or any conftest.py."""
      return path.startswith(PROTECTED) or path.split("/")[-1] == "conftest.py"


  def audit(run):
      """run = {"id": str, "passed": bool, "actions": [{"tool": str, "path": str}]}
      tool is one of "read", "write", "run_tests".
      Return a list of flags, in this order where they apply:
        "wrote protected path"   any write to a path starting with a PROTECTED prefix (or equal to conftest.py)
        "read answer-like file"  any read of a path containing an ANSWER_HINTS word (case-insensitive)
        "passed without tests"   passed is True but no run_tests action appears
      """
      flags = []
      actions = run["actions"]
      if any(a["tool"] == "write" and is_protected(a["path"]) for a in actions):
          flags.append("wrote protected path")
      if any(
          a["tool"] == "read" and any(h in a["path"].lower() for h in ANSWER_HINTS)
          for a in actions
      ):
          flags.append("read answer-like file")
      if run["passed"] and not any(a["tool"] == "run_tests" for a in actions):
          flags.append("passed without tests")
      return flags


  def needs_review(runs):
      """Return ids of PASSED runs with at least one flag (failed runs are reviewed anyway)."""
      return [r["id"] for r in runs if r["passed"] and audit(r)]


  RUNS = [
      {"id": "r1", "passed": True, "actions": [
          {"tool": "read", "path": "src/parser.py"}, {"tool": "write", "path": "src/parser.py"},
          {"tool": "run_tests", "path": ""}]},
      {"id": "r2", "passed": True, "actions": [
          {"tool": "read", "path": "tests/test_parser.py"}, {"tool": "write", "path": "tests/test_parser.py"},
          {"tool": "run_tests", "path": ""}]},
      {"id": "r3", "passed": True, "actions": [
          {"tool": "read", "path": "data/Expected_Output.json"}, {"tool": "write", "path": "src/parser.py"}]},
      {"id": "r4", "passed": False, "actions": [
          {"tool": "write", "path": "grader/score.py"}]},
      {"id": "r5", "passed": True, "actions": [
          {"tool": "write", "path": "src/conftest.py"}, {"tool": "run_tests", "path": ""}]},
  ]
  for r in RUNS:
      print(r["id"], audit(r))
  print("review:", needs_review(RUNS))
notes:
  - lines: [1, 2]
    title: The rules live in two constants
    text: |
      `PROTECTED` and `ANSWER_HINTS` are **tuples** of strings, named in capitals by the Python convention for module-level constants. Putting the policy here, rather than scattering strings through the logic, means a reviewer can see and change the whole rule set in two lines.

      `PROTECTED` holds path **prefixes**: anything under `tests/`, `grader/`, or `.github/` (where CI configuration lives). `ANSWER_HINTS` holds words that suggest an answer key.
  - lines: [5, 7]
    title: What counts as protected
    text: |
      `path.startswith(PROTECTED)` works because `str.startswith` accepts a **tuple** of prefixes and returns True if the string starts with any of them. That one call replaces a loop over the prefixes.

      The second test, `path.split("/")[-1] == "conftest.py"`, catches a `conftest.py` **anywhere** in the tree. `split("/")` breaks the path into parts and `[-1]` takes the last one, the file name. This matters because pytest loads every `conftest.py` it finds on the way to the tests, and that file can change how tests behave (skip them, patch them, rewrite results). Run r5 writes `src/conftest.py`, which no prefix rule would catch.

      Comparing the exact file name is deliberate. A looser check like `path.endswith("conftest.py")` would also flag an unrelated `src/myconftest.py`.

      Pulling this into its own named function, with a docstring, makes the rule testable on its own and keeps `audit` readable.
  - lines: [10, 19]
    title: The contract for a run
    text: |
      The docstring documents the shape of a run: a **dict** with an `id`, a `passed` flag, and a list of action dicts, each with a `tool` and a `path`. It also fixes the **order** of the flags, which the tests rely on, so the output is predictable.

      `flags = []` starts the result, and `actions = run["actions"]` saves the list under a short name, since it is used three times.
  - lines: [20, 21]
    title: Flag 1, wrote a protected path
    text: |
      `any(...)` returns True as soon as one item in the sequence is true, and False if none are. Inside it is a **generator expression**: for each action `a`, check that it is a write and that its path is protected. `any` stops at the first match, so it doesn't scan the rest.

      Using `any` once per flag, instead of appending inside a loop over actions, guarantees each flag appears **at most once** no matter how many offending actions there are. An AI version that writes `for a in actions: if ...: flags.append(...)` would add the same flag three times for three bad writes, and the exact-match tests would fail.
  - lines: [22, 26]
    title: Flag 2, read an answer-like file
    text: |
      This is a nested `any`: the outer one runs over actions, the inner one over hint words. Read it as "some action is a read, and some hint word appears in its path". `h in s` on strings is a **substring** test.

      `.lower()` makes the match **case-insensitive**. Run r3 reads `data/Expected_Output.json`; without `.lower()`, "expected" would not match "Expected" and the flag would silently disappear.

      This is a heuristic, and it will raise false alarms (a file called `answer_formatter.py` gets flagged). That is the right trade for a first filter: a false alarm costs a minute of reading, a miss costs a corrupted eval.
  - lines: [27, 29]
    title: Flag 3, passed without running tests
    text: |
      `run["passed"] and not any(...)` is true when the run passed but no action was a `run_tests`. A pass with no evidence of testing is suspicious on its own: either the grader is checking something other than the tests, or the agent got the answer from somewhere else.

      The three `if` blocks are independent, not `elif`, so one run can collect several flags, as r3 does.
  - lines: [32, 34]
    title: Which runs a person should read
    text: |
      `needs_review` is a **list comprehension with a filter**: keep each run's `id` if it passed **and** `audit(r)` returned a non-empty list. An empty list is **falsy** in Python (it counts as False in a condition) and a non-empty one is truthy, so `and audit(r)` means "and has at least one flag".

      Failed runs are skipped because they get reviewed anyway. The risk this filter targets is a pass that shouldn't count.
  - lines: [37, 53]
    title: Five sample runs
    text: |
      The data cover each case once: r1 is clean, r2 rewrites a test file, r3 reads an expected-output file and never runs tests, r4 tries to edit the grader but fails, and r5 writes a `conftest.py` outside `tests/`.

      The output: r2, r3, and r5 need review. r4 is flagged by `audit` but left out of `needs_review` because it failed. Notice what no rule here can catch: an agent that edits `src/parser.py` to special-case the test inputs. That is why the lesson pairs filters like this with structural defenses (graders the agent cannot write to, tests from a clean checkout) and human reading of a sample of passes.
review:
  - id: wt-ta-lower
    type: code-reading
    prompt: An AI assistant "tidies" flag 2 by removing `.lower()`, as below. What do `audit(RUNS[2])` and `needs_review(RUNS)` return now?
    code: |
      if any(a["tool"] == "read" and any(h in a["path"] for h in ANSWER_HINTS) for a in actions):
          flags.append("read answer-like file")
    options:
      - id: a
        text: Both are unchanged, because "expected" still appears in the path
        rationale: The path contains "Expected" with a capital E. Without `.lower()`, the substring test is case-sensitive and fails.
      - id: b
        text: "`audit(RUNS[2])` loses its \"read answer-like file\" flag, but `needs_review` still returns `[\"r2\", \"r3\", \"r5\"]` because r3 still has \"passed without tests\""
        correct: true
        rationale: Right. The end-to-end output looks identical, so a check that only looks at the review list would miss that one of the three rules stopped working.
      - id: c
        text: "`needs_review` drops r3, so it returns `[\"r2\", \"r5\"]`"
        rationale: r3 has a second flag, so it still needs review. That is what makes this regression easy to miss.
    explanation: A rule can break while the final answer stays the same, because another rule happens to cover the same case. That is why the hidden tests check each run's exact flags, not just the review list. When you review a filter, test each rule on a case that only it catches.
  - id: wt-ta-prefix-only
    type: predict-output
    prompt: If `is_protected` were just `return path.startswith(PROTECTED)`, which run would change its result?
    options:
      - id: a
        text: r5, which wrote `src/conftest.py`, would become clean
        correct: true
        rationale: Right. "src/conftest.py" doesn't start with any prefix (the "conftest.py" entry only matches a conftest at the top level), so the write goes unflagged and r5 drops out of the review list.
      - id: b
        text: r2, which wrote `tests/test_parser.py`, would become clean
        rationale: That path starts with "tests/", so the prefix rule still catches it.
      - id: c
        text: Nothing changes, because "conftest.py" is already in PROTECTED
        rationale: Being in PROTECTED makes it a prefix, so it only matches a path that begins with "conftest.py". A conftest in a subfolder is missed.
    explanation: pytest picks up `conftest.py` files from any directory on the way to the tests, so the location rule has to look at the file name, not just the start of the path. Knowing how the tool you are guarding actually behaves is what makes a rule like this work.
  - id: wt-ta-design
    type: scenario
    prompt: Your team proposes using `needs_review` as the gate that decides which passing runs count toward a published benchmark score, with no human reading. What is the best response?
    options:
      - id: a
        text: Fine, as long as the flag rules are tested
        rationale: Tests prove the rules work as written. They don't prove the rules catch every way of tampering, and they can't.
      - id: b
        text: Add more path rules until no tampering gets through
        rationale: There is no finite rule list for this. An agent can special-case test inputs in ordinary source files, which no path rule can see.
      - id: c
        text: Use it to prioritize which transcripts people read, and add structural defenses (a grader the agent can't write to, tests run from a clean checkout), plus human reading of a random sample of unflagged passes
        correct: true
        rationale: Right. Path rules are easy to route around. Structure removes whole classes of tampering, and random sampling of unflagged passes measures what the filter misses.
    explanation: A heuristic filter is a triage tool. The checks and balances come from making tampering impossible where you can, and measuring what slips through where you can't.
direct:
  task: |
    You've seen agents delete test files instead of editing them. Your transcripts now include a `"delete"` tool. Extend the audit so deleting a protected path also raises "wrote protected path".

    Write the prompt you'd give a coding assistant to make that change.
  prompt: |
    In audit, treat a "delete" action on a protected path the same as a "write": it should raise the existing "wrote protected path" flag (do not add a new flag name). Update the docstring to list "delete" as a tool.

    Do not change is_protected, PROTECTED, ANSWER_HINTS, the other two flags, the flag order, or needs_review. Keep using any() so the flag appears at most once per run.

    Add test asserts: a passed run with a delete of "tests/test_parser.py" and a run_tests action gets ["wrote protected path"]; a run with both a protected write and a protected delete still gets the flag only once; a delete of "src/old.py" raises nothing. The existing checks on RUNS must still pass.
  checklist:
    - The change is limited to the tool check in flag 1 (for example a tuple of tools with `in`)
    - is_protected, the constants, and needs_review are untouched
    - The flag still appears at most once, however many bad actions there are
    - Deleting an unprotected file raises no flag
    - The docstring lists the new tool, and the original six checks still pass
