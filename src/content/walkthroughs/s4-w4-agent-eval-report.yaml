id: s4-w4-agent-eval-report
summary: |
  After you run an agent many times on a set of scenarios, this program turns the raw trial records into the summary you'd put in front of a decision-maker: how often it succeeds, how consistently (pass^k), what each success costs, how many steps runs take (median and the long tail), and whether any trial broke a safety rule. A second function compares two configurations and says whether one is simply better than the other.

  Two design choices carry the lesson. The safety gate is computed separately from success, so a trial that "succeeded" while leaking data still fails the gate. And configurations are compared by **Pareto dominance** on success and cost together, so "more accurate but three times the price" is reported as a trade-off rather than a win.
code: |
  from math import comb


  def nearest_rank(values, q):
      """The q-th percentile (0 to 100) by nearest rank: sort, take element ceil(q/100 * n) - 1 (at least index 0)."""
      s = sorted(values)
      k = max(0, -(-q * len(s) // 100) - 1)
      return s[int(k)]


  def summarize(trials, k=3):
      """Summarize eval trials: success, pass^k, cost per success, step percentiles, and a safety gate.
      Each trial is {"scenario", "success": bool, "violation": bool, "steps": int, "cost": float}."""
      by_scenario = {}
      for t in trials:
          by_scenario.setdefault(t["scenario"], []).append(t)

      successes = sum(t["success"] for t in trials)
      total_cost = sum(t["cost"] for t in trials)

      # pass^k per scenario: the chance that k trials drawn from its n all succeeded.
      pass_k = [comb(sum(t["success"] for t in ts), k) / comb(len(ts), k)
                for ts in by_scenario.values()]

      steps = [t["steps"] for t in trials]
      violations = sorted({t["scenario"] for t in trials if t["violation"]})

      return {
          "success_rate": successes / len(trials),
          "pass_hat_k": sum(pass_k) / len(pass_k),
          "cost_per_success": total_cost / successes if successes else float("inf"),
          "steps_p50": nearest_rank(steps, 50),
          "steps_p90": nearest_rank(steps, 90),
          "violations": violations,
          "gate": "fail" if violations else "pass",
      }


  def dominates(a, b):
      """True if a passes the gate, is at least as good as b on success rate (higher) and
      cost per success (lower), and strictly better on at least one."""
      if a["gate"] != "pass":
          return False
      at_least_as_good = (a["success_rate"] >= b["success_rate"]
                          and a["cost_per_success"] <= b["cost_per_success"])
      strictly_better = (a["success_rate"] > b["success_rate"]
                         or a["cost_per_success"] < b["cost_per_success"])
      return at_least_as_good and strictly_better


  def T(s, ok, cost, steps=6, bad=False):
      return {"scenario": s, "success": ok, "violation": bad, "steps": steps, "cost": cost}


  small = [T("a", True, .01), T("a", True, .01), T("a", False, .01),
           T("b", True, .01), T("b", False, .01), T("b", False, .01, steps=30)]
  print(summarize(small))
  print("pass^2:", summarize(small, k=2)["pass_hat_k"])
notes:
  - lines: [1, 8]
    title: Combinations and a percentile helper
    text: |
      `comb(n, k)` from the `math` module counts the ways to choose `k` items from `n` ("n choose k"): `comb(3, 2)` is 3. It returns 0 when `k` is larger than `n`, which turns out to be useful below.

      `nearest_rank` was given. Its one tricky line uses `-(-a // b)`, a common idiom for **ceiling division**: `//` rounds down, and negating before and after turns that into rounding up. For the 90th percentile of 6 values, `ceil(0.9 * 6) = 6`, so it takes index 5, the largest value. `max(0, ...)` keeps the 0th percentile from producing index -1.

      Nearest rank always returns one of the actual values, never an interpolated one, which is easier to explain ("9 in 10 runs took 30 steps or fewer").
  - lines: [11, 16]
    title: Group trials by scenario
    text: |
      `by_scenario.setdefault(t["scenario"], [])` is **dict.setdefault**: it returns the list for that scenario, creating an empty one first if the scenario is new. Chaining `.append(t)` onto it adds the trial. After the loop, `by_scenario` looks like `{"a": [three trials], "b": [three trials]}`.

      Grouping first matters because pass^k is a per-scenario quantity: you want to know whether the agent is reliable on *each* task, not just on average.
  - lines: [18, 19]
    title: Totals
    text: |
      `sum(t["success"] for t in trials)` adds up booleans. In Python, `True` counts as 1 and `False` as 0 in arithmetic, so this counts the successes. It's a compact idiom; when you review it, just confirm the field really is a boolean and not a string like `"yes"` (which would raise an error) or a score.

      Cost is summed over **all** trials, including failures, because you pay for failed runs too.
  - lines: [21, 23]
    title: pass^k, consistency rather than luck
    text: |
      For a scenario with `n` trials and `c` successes, `comb(c, k) / comb(n, k)` is the probability that `k` trials picked at random from those `n` all succeeded. That estimates how likely the agent is to get this task right `k` times in a row.

      Worked example with `k = 2`: scenario `a` has 2 successes in 3 trials, so `comb(2, 2) / comb(3, 2) = 1/3`; scenario `b` has 1 success, and `comb(1, 2)` is 0. The mean over scenarios is 1/6, about 0.167. Compare the plain success rate of 0.5: an agent that succeeds half the time is rarely reliable twice running.

      The docstring requirement `n >= k` matters: with fewer trials than `k`, `comb(n, k)` is 0 and this line divides by zero. A careful version would check that up front and raise a clear error.
  - lines: [25, 26]
    title: Steps and violations
    text: |
      `steps` is a plain list for the percentiles. `{t["scenario"] for t in trials if t["violation"]}` is a **set comprehension** (curly braces), so a scenario with three violating trials is listed once. `sorted` turns the set into a list in a stable order.
  - lines: [28, 36]
    title: The summary, with the gate kept separate
    text: |
      The return value is a **dictionary literal** with one entry per metric, which reads like the report it becomes.

      - `cost_per_success` uses a **conditional expression** to return infinity (`float("inf")`) when nothing succeeded. Infinity compares correctly (it's worse than any real cost), where 0 or `None` would mislead or break comparisons.
      - `steps_p90` exposes runaway trials: in the demo the median is 6 but the 90th percentile is 30, the one run that went off the rails.
      - `gate` is `"fail"` if **any** scenario had a violation. It is not blended into the success rate. An AI-written summary that folds violations into an average ("98% safe") hides the one leak that matters.
  - lines: [39, 48]
    title: Pareto dominance
    text: |
      Configuration `a` dominates `b` if it is no worse on both success and cost, and strictly better on at least one. The two named booleans make each half of that definition readable on its own; the parentheses let each expression span two lines.

      Three cases from the tests:

      - A (0.9 success, $0.03) versus B (0.8, $0.05): A is better on both, so A dominates.
      - A versus C (0.95, $0.08): C succeeds more but costs more. Neither dominates; both are on the **frontier**, and choosing between them is a product decision.
      - A configuration that fails the safety gate dominates nothing, however cheap and accurate it is.

      `dominates(A, A)` is `False` because of the "strictly better" half. Without it, every configuration would dominate itself, and a frontier calculation built on this function would discard ties incorrectly.
  - lines: [51, 58]
    title: The demo data
    text: |
      `T` is a tiny helper that builds one trial dictionary, with **default arguments** for the usual steps and no violation, so each trial fits on one line.

      The demo summarizes six trials with the default `k = 3` (pass^3 is 0, since no scenario has three successes) and then prints pass^2, about 0.167. Press **Run this code** to see the full summary.
review:
  - id: wt-eval-valid-denominator
    type: code-reading
    prompt: An AI assistant changes `success_rate` to "ignore trials that broke policy, since those are tracked by the gate", as below. For the `leaky` trials in the tests (the six demo trials plus one successful trial with a violation), what changes?
    code: |
      clean = [t for t in trials if not t["violation"]]
      "success_rate": sum(t["success"] for t in clean) / len(clean),
    options:
      - id: a
        text: Nothing; the gate still fails, so it doesn't matter
        rationale: The gate still fails, but the success rate now describes a different population, so it can't be compared with other configurations' rates.
      - id: b
        text: The success rate drops from 4/7 to 3/6, and it no longer describes all runs the agent actually made
        correct: true
        rationale: Right. Silently dropping trials changes the denominator. Report all trials, and let the gate speak about safety separately.
      - id: c
        text: It raises ZeroDivisionError
        rationale: Only if every trial had a violation.
    explanation: Every filter on eval data is a claim about what the number means. Changing which trials count, without saying so, is one of the easiest ways for an eval report to mislead.
  - id: wt-eval-pass-k
    type: predict-output
    prompt: A scenario has 5 trials with 4 successes. What is its pass^2, `comb(4, 2) / comb(5, 2)`?
    options:
      - id: a
        text: 0.8, the same as its success rate
        rationale: That's pass^1. Requiring two successes is stricter.
      - id: b
        text: "0.6"
        correct: true
        rationale: Yes. `comb(4, 2) = 6` and `comb(5, 2) = 10`, so 6/10.
      - id: c
        text: 0.64, which is 0.8 squared
        rationale: Close, but this estimator draws without replacement from the actual trials, so it's 6/10, not 0.8 squared.
    explanation: pass^k falls quickly as k grows unless the agent is consistently right. That is the number to show when a workflow will run the same task many times a day.
  - id: wt-eval-frontier
    type: scenario
    prompt: Configuration X has success 0.92 at $0.04 per success; Y has 0.88 at $0.02. Neither fails the gate. What should the report say?
    options:
      - id: a
        text: X is better because it succeeds more often
        rationale: That ignores that Y costs half as much per success.
      - id: b
        text: Neither dominates; state the trade-off (4 points of success for twice the cost per success) and let the product need decide
        correct: true
        rationale: Exactly. Both are on the frontier, and the choice depends on how costly a failure is compared with the price difference.
      - id: c
        text: Y dominates X because it is cheaper
        rationale: Y is worse on success, so it can't dominate.
    explanation: Pareto comparison stops a report from crowning a winner the data doesn't support. Your job is to state the trade-off in plain terms, ideally with intervals on both numbers.
direct:
  task: |
    Product wants to see whether the agent is reliable on every scenario, not just on average. Add the worst scenario's pass^k to the summary as `worst_pass_hat_k`, along with which scenario it was.

    Write the prompt you'd give a coding assistant.
  prompt: |
    In summarize, add two keys: "worst_pass_hat_k", the minimum per-scenario pass^k, and "worst_scenario", the scenario id that has it (if several tie, the alphabetically first). Compute it from the same per-scenario values used for pass_hat_k; don't recompute pass^k a second way.

    Also make summarize raise ValueError with a clear message if any scenario has fewer than k trials, instead of dividing by zero.

    Do not change any existing key or its value, nearest_rank, or dominates. Add tests for: the worst scenario in the small example with k=2 ("b", 0.0), a tie broken alphabetically, and the ValueError for too few trials.
  checklist:
    - All existing keys and values are unchanged, so the existing tests still pass
    - The worst value reuses the per-scenario pass^k list instead of a second calculation
    - Ties are broken deterministically (alphabetically), not by dictionary order
    - Too few trials raises ValueError with a message naming the scenario
    - dominates and nearest_rank are untouched
