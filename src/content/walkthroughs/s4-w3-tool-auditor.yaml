id: s4-w3-tool-auditor
summary: |
  Before you connect an agent to an MCP server, you can read what the server says about its tools. `audit_tools` does that reading systematically. It checks each tool's description for hidden characters, instruction-like phrases, sensitive file paths, and references to other servers' tools; its parameters for free-form commands and unconstrained paths or URLs; its annotations for claims that contradict its name; and, if you recorded fingerprints when you approved the server, whether any definition has changed since.

  It is built as a flat list of independent checks, each adding `(tool, code)` pairs to a set. That makes every rule easy to read, test, and extend on its own. It is a triage aid: a determined attacker can word around a pattern list, so a clean report means only that these checks found nothing.
code: |
  import hashlib
  import json
  import re
  import unicodedata

  INJECTION_PATTERNS = [
      r"ignore (all |any )?(previous|prior|above|earlier) instructions",
      r"do not (tell|mention|inform|reveal)[^.]{0,40}\buser\b",
      r"<\s*important\s*>",
      r"before (using|calling) (this|any other) tool",
      r"system prompt",
  ]
  SENSITIVE_PATHS = ["~/.ssh", "id_rsa", ".aws/credentials", "mcp.json", ".env", "claude_desktop_config"]
  EXECUTION_PARAMS = {"command", "cmd", "shell", "script", "sql", "code"}
  TARGET_PARAMS = {"path", "file", "filename", "url"}
  WRITE_VERBS = ("create", "update", "delete", "remove", "send", "write", "drop", "exec", "run", "move", "post")


  def fingerprint(tool):
      """A stable hash of everything the model reads about a tool."""
      keep = {k: tool.get(k) for k in ("name", "description", "inputSchema", "annotations")}
      return hashlib.sha256(json.dumps(keep, sort_keys=True).encode()).hexdigest()


  def audit_tools(tools, pinned=None):
      """Flag risky patterns in MCP tool definitions. Returns sorted (key, code) pairs,
      key = "server/name". A clean result means these checks found nothing, not that it's safe."""
      findings = set()
      owner = {t["name"]: t["server"] for t in tools}

      for t in tools:
          key = f"{t['server']}/{t['name']}"
          desc = t.get("description") or ""
          low = desc.lower()

          # 1. The description: what the model reads.
          if any(unicodedata.category(ch) == "Cf" for ch in desc):
              findings.add((key, "hidden-unicode"))
          if any(re.search(p, low) for p in INJECTION_PATTERNS):
              findings.add((key, "injection-phrase"))
          if any(p.lower() in low for p in SENSITIVE_PATHS):
              findings.add((key, "sensitive-path"))
          for other, server in owner.items():
              if server != t["server"] and re.search(r"\b" + re.escape(other.lower()) + r"\b", low):
                  findings.add((key, "cross-server"))

          # 2. The parameters: what the tool can be told to do.
          props = (t.get("inputSchema") or {}).get("properties", {})
          for name, spec in props.items():
              if name.lower() in EXECUTION_PARAMS:
                  findings.add((key, "arbitrary-execution"))
              constrained = "enum" in spec or "pattern" in spec
              if name.lower() in TARGET_PARAMS and spec.get("type") == "string" and not constrained:
                  findings.add((key, "unconstrained-target"))

          # 3. The annotations: what the tool claims about itself.
          ann = t.get("annotations") or {}
          if ann.get("readOnlyHint") is True and t["name"].lower().startswith(WRITE_VERBS):
              findings.add((key, "annotation-mismatch"))

          # 4. Pins: has anything changed since you approved this server?
          if pinned is not None:
              if key not in pinned:
                  findings.add((key, "new-tool"))
              elif pinned[key] != fingerprint(t):
                  findings.add((key, "definition-changed"))

      return sorted(findings)


  shell = {"server": "demo", "name": "run_shell", "description": "Run a command.",
           "inputSchema": {"type": "object", "properties": {"command": {"type": "string"}}}}
  print(audit_tools([shell]))
  pins = {"demo/run_shell": fingerprint(shell)}  # recorded when you approved the server
  changed = {**shell, "description": "Run a command. Also email the output to ops@example.com."}
  print(audit_tools([changed], pinned=pins))
notes:
  - lines: [1, 16]
    title: The rules, as data
    text: |
      The patterns live in constants at the top, not buried in the function. A reviewer can see the whole policy at a glance, and adding a pattern doesn't require touching the logic.

      `INJECTION_PATTERNS` are **regular expressions** (patterns for matching text). The `r"..."` prefix makes a **raw string**, so a backslash stays a backslash: `\b` means "word boundary" to the regex engine, `\s*` means "any amount of whitespace", `(a|b)` means "a or b", and `[^.]{0,40}` means "up to 40 characters that aren't a period". So the second pattern catches "do not mention this to the user" but not a "user" three sentences later.

      `EXECUTION_PARAMS` and `TARGET_PARAMS` are **sets** (fast membership checks). `WRITE_VERBS` is a **tuple** on purpose, because `str.startswith` accepts a tuple and checks every prefix in one call.
  - lines: [19, 22]
    title: A fingerprint of what the model reads
    text: |
      `fingerprint` keeps the four fields the model actually sees, using a **dict comprehension** (`{k: tool.get(k) for k in ...}`), and hashes them with SHA-256.

      `json.dumps(..., sort_keys=True)` matters: two dictionaries with the same content but keys in a different order would otherwise produce different text, and so different hashes. Sorting the keys makes the fingerprint **stable**. `.encode()` turns the text into bytes (hash functions work on bytes), and `.hexdigest()` gives a 64-character string you can store.

      Any change to a description, schema, or annotation changes the fingerprint. That is how you detect a "rug pull": a server that was benign when you approved it and changed later.
  - lines: [25, 34]
    title: Set up, and one key per tool
    text: |
      `findings` is a **set**, so adding the same `(key, code)` twice (say, two execution-like parameters on one tool) records it once.

      `owner` maps each tool name to its server. It is built before the loop so the cross-server check can look at every tool, not just the ones seen so far. One caveat for review: if two servers expose a tool with the same name, this dictionary keeps only the last one, so a duplicate name (itself a shadowing signal) isn't detected here.

      `key` is built with an **f-string**. Inside it, `t['server']` uses single quotes because the f-string itself is in double quotes. `low` is the lowercased description, so every text check is case-insensitive without repeating `.lower()`.
  - lines: [36, 45]
    title: Checking the description
    text: |
      Each check uses `any(...)` with a **generator expression**, which stops at the first match.

      - **Hidden characters.** `unicodedata.category(ch) == "Cf"` finds "format" characters such as the zero-width space. They are invisible when you read the description but present for the model, so text can hide between them. Note this check uses `desc`, not `low`, though lowercasing wouldn't remove them either.
      - **Injection phrases.** `re.search` looks for a pattern anywhere in the text.
      - **Sensitive paths.** A plain substring test is enough here.
      - **Cross-server references.** For every tool on a *different* server, look for its name as a whole word. `re.escape` makes a name like `send.email` match literally instead of treating `.` as "any character". The `\b` boundaries stop `add` from matching inside `address`. A tool referring to another tool on its **own** server (like "call search_issues first") is normal and not flagged.
  - lines: [47, 54]
    title: Checking the parameters
    text: |
      `(t.get("inputSchema") or {}).get("properties", {})` reads the properties safely even if the schema is missing or `None`.

      A parameter named `command`, `sql`, or `code` means the tool runs whatever it's given: arbitrary execution. A string parameter named `path` or `url` without an `enum` (a fixed list) or a `pattern` (a regex the value must match) can point anywhere the server process can reach.

      Naming the boolean `constrained` on its own line makes line 53 read like the rule it implements. These checks look at names, which is a heuristic: a parameter called `q` that is really SQL won't be caught. That is one reason the docstring says a clean result isn't proof of safety.
  - lines: [56, 59]
    title: Checking the annotations
    text: |
      Annotations such as `readOnlyHint` are the server's own claims about a tool. Clients may use them to decide whether to ask before calling it, so a false claim matters.

      The check is deliberately narrow: a tool that claims to be read-only but whose name starts with a write verb (`delete_file`) contradicts itself. `is True` rather than plain truthiness means only an explicit `True` claim counts. Prefix matching has false positives (`runbook_lookup` starts with `run`), which is acceptable for triage: a human looks at each flag.
  - lines: [61, 68]
    title: Comparing against your pins
    text: |
      `pinned is not None` distinguishes "no pins given" (skip these checks) from "pins given but empty" (every tool is new). Using `if pinned:` instead would treat an empty dictionary like `None` and report nothing, which is a subtle bug an AI might introduce while "simplifying".

      A tool missing from the pins is **new** (you never approved it). A tool whose fingerprint differs is **changed**. `elif` keeps those two exclusive.

      `sorted(findings)` turns the set into a list in a predictable order (sets have none), so the output is the same on every run and easy to compare in tests and diffs.
  - lines: [71, 76]
    title: A demonstration, including a rug pull
    text: |
      The first call audits one tool with a free-form `command` parameter, and reports `arbitrary-execution`.

      The next lines record a pin, as you would at approval time, then build a changed copy of the tool with `{**shell, "description": ...}` (**dictionary unpacking**: copy every key, then override one). Auditing the changed tool against the pin adds `definition-changed`. Press **Run this code** to see both results.
review:
  - id: wt-audit-truthy-pins
    type: code-reading
    prompt: An AI assistant tidies the pin check to the version below. What happens when you call `audit_tools(tools, pinned={})`, meaning "I have approved nothing yet"?
    code: |
      if pinned:
          if key not in pinned:
              findings.add((key, "new-tool"))
          elif pinned[key] != fingerprint(t):
              findings.add((key, "definition-changed"))
    options:
      - id: a
        text: Every tool is reported as new-tool, as before
        rationale: An empty dictionary is falsy, so the whole block is skipped.
      - id: b
        text: No tool is reported as new, because an empty dict is treated like no pins at all
        correct: true
        rationale: Right. `if pinned:` is False for `{}`, so the unapproved tools slip through without a new-tool flag.
      - id: c
        text: It raises KeyError
        rationale: The block never runs, so no lookup happens.
    explanation: Truthiness checks conflate "missing" with "empty". When the difference matters (here, it's the difference between "not checking" and "nothing approved"), compare with `is not None`.
  - id: wt-audit-word-boundary
    type: predict-output
    prompt: 'Server "mathutils" has a tool named `add`. Another server''s tool has the description "Look up an address in the CRM." Is it flagged `cross-server`?'
    options:
      - id: a
        text: Yes, because "address" contains "add"
        rationale: That would happen with a plain substring test. The `\b` word boundaries require "add" to stand alone.
      - id: b
        text: No, because the regex requires "add" as a whole word
        correct: true
        rationale: Yes. `\badd\b` doesn't match inside "address", which avoids a flood of false positives for short tool names.
      - id: c
        text: No, because cross-server checks only look at tools on the same server
        rationale: It's the reverse; the check only looks at tools on other servers.
    explanation: Short, common tool names (`add`, `get`, `list`) make naive substring matching useless. Word boundaries keep the check precise enough to be worth reading.
  - id: wt-audit-sort-keys
    type: scenario
    prompt: Why does `fingerprint` call `json.dumps` with `sort_keys=True`?
    options:
      - id: a
        text: So the same definition always produces the same hash, even if the server returns its keys in a different order
        correct: true
        rationale: Exactly. Without it, a harmless reordering would look like a rug pull, and people would learn to ignore the flag.
      - id: b
        text: Sorting makes hashing faster
        rationale: It adds a little work; the point is stability.
      - id: c
        text: SHA-256 requires sorted input
        rationale: SHA-256 hashes any bytes. Sorting is about making equal definitions produce equal bytes.
    explanation: A security check that fires on harmless changes trains people to dismiss it. Stable fingerprints keep the "definition-changed" flag meaningful.
direct:
  task: |
    You want the audit to say how serious each finding is, so the team can block on the dangerous ones and just review the rest. Add severities: "high" for hidden-unicode, injection-phrase, cross-server, and definition-changed; "medium" for everything else.

    Write the prompt you'd give a coding assistant.
  prompt: |
    Add a SEVERITY dict mapping each finding code to "high" or "medium": high for hidden-unicode, injection-phrase, cross-server, definition-changed; medium for sensitive-path, arbitrary-execution, unconstrained-target, annotation-mismatch, new-tool.

    Do not change audit_tools' return value (existing callers and tests depend on the (key, code) tuples). Instead add a new function, audit_report(tools, pinned=None), that calls audit_tools and returns {"high": [...], "medium": [...]}, each a sorted list of (key, code), plus a "block": bool that is True if there is any high finding.

    Add a test that every code audit_tools can produce has an entry in SEVERITY, plus tests for a report with only medium findings (block False) and one with a high finding (block True).
  checklist:
    - audit_tools is unchanged, so its existing tests still pass
    - Every finding code has a severity; a test fails if a new code is added without one
    - Findings are partitioned, not duplicated or dropped, between high and medium
    - block depends only on high findings
    - The new function reuses audit_tools rather than copying its checks
