# ---------- Statistics ----------
- id: anthropic-stats-evals-post
  title: A statistical approach to model evaluations
  author: Anthropic (Evan Miller)
  url: https://www.anthropic.com/research/statistical-approach-to-model-evals
  license: Copyright Anthropic
  policy: summarize
  kind: blog
  notes: November 2024 companion post to Miller's paper. Five recommendations; clustered SEs on popular evals can be over three times naive SEs.

- id: efron-1979-bootstrap
  title: "Bootstrap Methods: Another Look at the Jackknife (Efron, 1979)"
  author: Bradley Efron
  url: https://doi.org/10.1214/aos/1176344552
  license: Copyright Institute of Mathematical Statistics
  policy: summarize
  kind: paper
  notes: The Annals of Statistics 7(1). Introduces the bootstrap.

- id: mcnemar-1947
  title: Note on the Sampling Error of the Difference Between Correlated Proportions or Percentages (McNemar, 1947)
  author: Quinn McNemar
  url: https://doi.org/10.1007/BF02295996
  license: Copyright The Psychometric Society
  policy: summarize
  kind: paper
  notes: Psychometrika 12(2), 153 to 157. The origin of McNemar's test.

- id: dietterich-1998-tests
  title: Approximate Statistical Tests for Comparing Supervised Classification Learning Algorithms (Dietterich, 1998)
  author: Thomas G. Dietterich
  url: https://web.engr.oregonstate.edu/~tgd/publications/dietterich-approximate-statistical-tests-nc1998.pdf
  license: Copyright MIT Press (author's copy)
  policy: summarize
  kind: paper
  notes: Neural Computation 10(7), 1895 to 1923, DOI 10.1162/089976698300017197. McNemar's test has low Type I error for single-run comparisons.

- id: brown-cai-dasgupta-2001
  title: Interval Estimation for a Binomial Proportion (Brown, Cai, and DasGupta, 2001)
  author: Lawrence D. Brown, T. Tony Cai, Anirban DasGupta
  url: https://doi.org/10.1214/ss/1009213286
  license: Copyright Institute of Mathematical Statistics
  policy: summarize
  kind: paper
  notes: Statistical Science 16(2), 101 to 133. Wald interval coverage is erratic; recommends Wilson or Jeffreys for small n.

- id: madaan-2024-variance
  title: Quantifying Variance in Evaluation Benchmarks (Madaan et al., 2024)
  author: Madaan et al.
  url: https://arxiv.org/abs/2406.10229
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper

