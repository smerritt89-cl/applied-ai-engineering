# ---------- Benchmarks, read critically ----------
- id: zhang-2024-gsm1k
  title: A Careful Examination of Large Language Model Performance on Grade School Arithmetic (Zhang et al., 2024)
  author: Zhang et al.
  url: https://arxiv.org/abs/2405.00332
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: GSM1k. Up to 8 percent drops versus GSM8k for some models; frontier models showed minimal overfitting.

- id: phan-2025-hle
  title: Humanity's Last Exam (Phan et al., 2025)
  author: Phan et al.
  url: https://arxiv.org/abs/2501.14249
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Motivated by saturation; the abstract notes over 90 percent accuracy on MMLU.

- id: hf-mmlu-implementations
  title: What's going on with the Open LLM Leaderboard?
  author: Clementine Fourrier, Nathan Habib, Julien Launay, Thomas Wolf (Hugging Face)
  url: https://huggingface.co/blog/open-llm-leaderboard-mmlu
  license: Copyright Hugging Face
  policy: summarize
  kind: blog
  notes: June 2023. Three MMLU implementations gave different scores and different rankings for the same models.
