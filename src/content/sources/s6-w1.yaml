# ---------- Anthropic docs (summarize) ----------
- id: claude-refusals-fallback
  title: Refusals and fallback
  author: Anthropic
  url: https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback
  license: Copyright Anthropic
  policy: summarize
  kind: docs
  notes: >-
    Checked 2026-11-11. Refusals arrive as normal responses with stop_reason "refusal" and a stop_details category;
    server-side fallbacks ("default" or an explicit list) under the server-side-fallback-2026-07-01 beta; not on the
    Batches API; no server-side fallback for Claude Haiku 5.5; retrying a refused request on the same model usually
    earns another refusal; refusals count against rate limits.

- id: claude-authentication-docs
  title: Authentication
  author: Anthropic
  url: https://platform.claude.com/docs/en/manage-claude/authentication
  license: Copyright Anthropic
  policy: summarize
  kind: docs
  notes: >-
    Checked 2026-11-11. Key types (personal, service account), expiration, storing keys in a secrets manager,
    Workload Identity Federation for production workloads, and "Browser-based applications": call the API from your
    own back end, because anyone can read a key shipped in page code.

# ---------- Resilience engineering (summarize) ----------
- id: aws-builders-timeouts-retries
  title: Timeouts, retries, and backoff with jitter (Amazon Builders' Library)
  author: Marc Brooker (Amazon)
  url: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
  license: Copyright Amazon.com, Inc.
  policy: summarize
  kind: blog
  notes: >-
    Published 2019-12-05; moved from aws.amazon.com/builders-library to builder.aws.com (checked 2026-11-11).
    Timeouts from latency percentiles, retry amplification across layers, local retry token buckets, jitter,
    idempotency before retrying side effects, and a caution that circuit breakers add hard-to-test modal behavior.

- id: fowler-circuit-breaker
  title: CircuitBreaker
  author: Martin Fowler
  url: https://martinfowler.com/bliki/CircuitBreaker.html
  license: Copyright Martin Fowler
  policy: summarize
  kind: blog
  notes: March 2014. Closed, open, and half-open states; failure threshold, reset timeout, trial call, and monitoring.

- id: google-sre-cascading-failures
  title: "Site Reliability Engineering, Chapter 22: Addressing Cascading Failures"
  author: Mike Ulrich (Google), in Beyer, Jones, Petoff and Murphy (eds.)
  url: https://sre.google/sre-book/addressing-cascading-failures/
  license: Copyright Google (free to read online)
  policy: summarize
  kind: book
  notes: >-
    Retry budgets, retrying at one layer, randomized exponential backoff, deadlines and deadline propagation, load
    shedding, and graceful degradation (including testing the degraded path).

- id: httpx-timeouts
  title: HTTPX documentation, Timeouts
  author: Encode
  url: https://www.python-httpx.org/advanced/timeouts/
  license: BSD-3-Clause (docs in the HTTPX repository)
  policy: summarize
  kind: docs
  notes: >-
    The four timeout types (connect, read, write, pool); a single float sets all four; the read timeout bounds the
    wait for each chunk, not the whole response. The anthropic 1.x Python SDK uses the httpx2 fork with the same model.

