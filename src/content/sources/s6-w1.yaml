# ---------- Hosting platforms (summarize; limits checked 2026-11-11) ----------
- id: vercel-functions-limits
  title: Vercel Functions limits
  author: Vercel
  url: https://vercel.com/docs/functions/limitations
  license: Copyright Vercel
  policy: summarize
  kind: docs
  notes: >-
    Page updated 2026-08-24. With Fluid compute: 300 s default and maximum on Hobby; 300 s default and 800 s maximum on
    Pro and Enterprise (1800 s extended maximum in beta). Max duration includes time spent streaming the response.
    Edge runtime must start responding within 25 s and can stream for up to 300 s. 4.5 MB body limit, not applied to
    streamed responses.

- id: vercel-env-vars
  title: Vercel environment variables
  author: Vercel
  url: https://vercel.com/docs/environment-variables
  license: Copyright Vercel
  policy: summarize
  kind: docs
  notes: >-
    Production, Preview, Development, and custom environments; Config versus write-only Secret values; changes apply
    only to new deployments; 64 KB total per deployment.

- id: cloudflare-workers-limits
  title: Cloudflare Workers limits
  author: Cloudflare
  url: https://developers.cloudflare.com/workers/platform/limits/
  license: CC BY 4.0 (Cloudflare docs)
  policy: summarize
  kind: docs
  notes: >-
    CPU time per HTTP request: 10 ms on Free; 30 s default, up to 5 min, on Paid. No hard wall-clock limit for
    HTTP-triggered Workers while the client stays connected; waiting on network I/O does not count as CPU time.
    Work can be canceled when the client disconnects; waitUntil extends up to 30 s.

- id: cloudflare-workers-secrets
  title: Cloudflare Workers secrets
  author: Cloudflare
  url: https://developers.cloudflare.com/workers/configuration/secrets/
  license: CC BY 4.0 (Cloudflare docs)
  policy: summarize
  kind: docs
  notes: wrangler secret put, secrets on the env binding, hidden after creation, .dev.vars for local development.

- id: cloud-run-request-timeout
  title: Cloud Run, Configure request timeout for services
  author: Google Cloud
  url: https://docs.cloud.google.com/run/docs/configuring/request-timeout
  license: CC BY 4.0 (Google Cloud docs)
  policy: summarize
  kind: docs
  notes: Default 300 s, configurable up to 3600 s; a request that exceeds it gets a 504.

- id: cloud-run-secrets
  title: Cloud Run, Configure secrets for services
  author: Google Cloud
  url: https://docs.cloud.google.com/run/docs/configuring/services/secrets
  license: CC BY 4.0 (Google Cloud docs)
  policy: summarize
  kind: docs
  notes: >-
    Secret Manager secrets as environment variables (resolved at instance start; pin a version) or mounted volumes
    (read at access time; work with rotation).

# ---------- Configuration and secrets practice (summarize) ----------
- id: twelve-factor-config
  title: "The Twelve-Factor App: III. Config"
  author: Adam Wiggins
  url: https://12factor.net/config
  license: Copyright Adam Wiggins
  policy: summarize
