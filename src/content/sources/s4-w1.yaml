# ---------- Research and reports ----------
- id: kwa-2025-metr-horizon
  title: Measuring AI Ability to Complete Long Software Tasks (Kwa et al., 2025)
  author: Thomas Kwa, Ben West, and colleagues (METR)
  url: https://arxiv.org/abs/2503.14499
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: The 50% task-completion time horizon; doubling roughly every seven months since 2019 on their task suite.

- id: metr-horizon-blog
  title: Measuring AI Ability to Complete Long Tasks (METR blog post)
  author: METR
  url: https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/
  license: Copyright METR
  policy: summarize
  kind: report
  notes: Published 2025-03-19. Near-100% success under about 4 minutes, under 10% over about 4 hours, for models at the time; caveats on messiness and external validity.

- id: becker-2025-metr-rct
  title: Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity (Becker et al., 2025)
  author: Joel Becker, Nate Rush, and colleagues (METR)
  url: https://arxiv.org/abs/2507.09089
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: RCT, 16 developers, 246 tasks; AI allowed increased completion time by 19% while developers believed it saved 20%. METR has since published an update on later tools.

- id: kapoor-2024-agents-matter
  title: AI Agents That Matter (Kapoor et al., 2024)
  author: Sayash Kapoor, Benedikt Stroebl, Zachary S. Siegel, Nitya Nadgir, Arvind Narayanan
  url: https://arxiv.org/abs/2407.01502
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Accuracy-only agent benchmarks reward needless cost and complexity; evaluate cost and accuracy jointly; holdout sets and reproducibility.

- id: yao-2022-react
  title: "ReAct: Synergizing Reasoning and Acting in Language Models (Yao et al., 2022)"
  author: Shunyu Yao and colleagues
  url: https://arxiv.org/abs/2210.03629
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper

- id: madaan-2023-self-refine
  title: "Self-Refine: Iterative Refinement with Self-Feedback (Madaan et al., 2023)"
  author: Aman Madaan and colleagues
  url: https://arxiv.org/abs/2303.17651
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper

- id: huang-2023-self-correct
  title: Large Language Models Cannot Self-Correct Reasoning Yet (Huang et al., 2023)
  author: Jie Huang, Xinyun Chen, and colleagues
  url: https://arxiv.org/abs/2310.01798
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Intrinsic self-correction without external feedback often fails on reasoning tasks and can degrade answers.

