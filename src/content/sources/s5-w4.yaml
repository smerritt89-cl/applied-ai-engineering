# ---------- Small fine-tuned models versus frontier models ----------
- id: bucher-2024-finetuned-small
  title: "Fine-Tuned 'Small' LLMs (Still) Significantly Outperform Zero-Shot Generative AI Models in Text Classification (Bucher and Martini, 2024)"
  author: Martin Juan Jose Bucher and Marco Martini
  url: https://arxiv.org/abs/2406.08660
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Fine-tuned BERT-style models beat zero-shot GPT-3.5, GPT-4, and Claude Opus on several classification tasks.

- id: hsieh-2023-distilling-step
  title: "Distilling Step-by-Step! Outperforming Larger Language Models with Less Training Data and Smaller Model Sizes (Hsieh et al., 2023)"
  author: Cheng-Yu Hsieh et al.
  url: https://arxiv.org/abs/2305.02301
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Findings of ACL 2023. A 770M T5 trained on rationales beat few-shot 540B PaLM on one benchmark with 80% of the data.

- id: hinton-2015-distillation
  title: Distilling the Knowledge in a Neural Network (Hinton, Vinyals, and Dean, 2015)
  author: Geoffrey Hinton, Oriol Vinyals, Jeff Dean
  url: https://arxiv.org/abs/1503.02531
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper

