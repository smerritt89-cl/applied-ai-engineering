# ---------- Benchmarks and measurement ----------
- id: e2-epoch-swebench-verified-review
  title: SWE-bench Verified, benchmark review (Epoch AI)
  author: Epoch AI
  url: https://epoch.ai/benchmarks/swe-bench-verified/review
  license: Copyright Epoch AI
  policy: summarize
  kind: report
  notes: >-
    Review published 2026-09-03. Reports OpenAI's 2026-02-23 audit (27.6% of tasks audited, 59.4% of those with flawed
    tests, a floor of 16.4% of all tasks) and contamination finding; Epoch rates the benchmark Flawed.

- id: e2-swebench-pro-2025
  title: "SWE-Bench Pro: Can AI Agents Solve Long-Horizon Software Engineering Tasks? (Deng et al., 2025)"
  author: Xiang Deng and colleagues (Scale AI)
  url: https://arxiv.org/abs/2509.16941
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: 1,865 problems from 41 actively maintained repositories, split into public, held-out, and commercial sets.

- id: e2-merrill-2026-terminal-bench
  title: "Terminal-Bench: Benchmarking Agents on Hard, Realistic Tasks in Command Line Interfaces (Merrill et al., 2026)"
  author: Mike A. Merrill, Alexander G. Shaw, Nicholas Carlini, and colleagues
  url: https://arxiv.org/abs/2601.11868
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Terminal-Bench 2.0, 89 tasks, each with its own environment, a human-written reference solution, and tests; frontier agents under 65% at publication. ICLR 2026.

- id: e2-tbench-site
  title: Terminal-Bench
  author: Terminal-Bench team
  url: https://www.tbench.ai/
  license: Copyright Terminal-Bench authors
  policy: summarize
  kind: report

- id: e2-metr-2026-uplift-update
  title: We are Changing our Developer Productivity Experiment Design (METR, 2026)
  author: Joel Becker, Nate Rush, Tom Cunningham, David Rein, Khalid Mahamud (METR)
  url: https://metr.org/blog/2026-02-24-uplift-update/
  license: Copyright METR
  policy: summarize
  kind: report
  notes: >-
    Published 2026-02-24. 57 developers, 143 repositories, 800+ tasks from August 2025; estimates of -18% (CI -38% to
    +9%) for returning developers and -4% (CI -15% to +9%) for new ones, which METR calls an unreliable, likely
    lower-bound signal because of developer and task selection.

- id: e2-metr-2025-study-blog
  title: Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity (METR blog)
  author: METR
  url: https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/
  license: Copyright METR
  policy: summarize
  kind: report

- id: e2-metr-reward-hacking
  title: Recent Frontier Models Are Reward Hacking (METR, 2025)
  author: METR
  url: https://metr.org/blog/2025-06-05-recent-reward-hacking/
  license: Copyright METR
  policy: summarize
  kind: report
  notes: Published 2025-06-05. Overwriting timers, stubbing evaluators, editing tests; telling the model not to cheat had a nearly negligible effect on one task.

- id: e2-zhong-2025-impossiblebench
  title: "ImpossibleBench: Measuring LLMs' Propensity of Exploiting Test Cases (Zhong, Raghunathan, Carlini, 2025)"
  author: Ziqian Zhong, Aditi Raghunathan, Nicholas Carlini
  url: https://arxiv.org/abs/2510.20270
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Tasks whose tests contradict the spec; frontier models frequently cheat, stronger models more; hiding tests cut cheating to near zero.

- id: e2-peng-2023-copilot
  title: "The Impact of AI on Developer Productivity: Evidence from GitHub Copilot (Peng et al., 2023)"
  author: Sida Peng, Eirini Kalliamvakou, Peter Cihon, Mert Demirer
  url: https://arxiv.org/abs/2302.06590
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Controlled experiment, one task (an HTTP server in JavaScript); treatment group 55.8% faster.

- id: e2-cui-2025-field-experiments
  title: "The Effects of Generative AI on High-Skilled Work: Evidence from Three Field Experiments with Software Developers (Cui et al.)"
  author: Kevin Zheyuan Cui, Mert Demirer, Sonia Jaffe, Leon Musolff, Sida Peng, Tobias Salz
  url: https://economics.mit.edu/sites/default/files/inline-files/draft_copilot_experiments.pdf
  license: Copyright the authors
  policy: summarize
  kind: paper
  notes: Randomized trials at Microsoft, Accenture, and a Fortune 100 company, 4,867 developers; about 26% more completed tasks among adopters; larger gains for less experienced developers. Published in Management Science (doi 10.1287/mnsc.2025.00535).

- id: e2-dora-2025
  title: State of AI-assisted Software Development 2025 (DORA)
  author: DORA (Google Cloud)
  url: https://dora.dev/research/2025/dora-report/
  license: Copyright Google
  policy: summarize
  kind: report
  notes: Central finding that AI acts as an amplifier of an organization's existing strengths and weaknesses.

- id: e2-shen-2026-skill-formation
  title: How AI assistance impacts the formation of coding skills (Anthropic research, 2026)
  author: Judy Hanwen Shen, Alex Tamkin (Anthropic)
  url: https://www.anthropic.com/research/AI-assistance-coding-skills
  license: Copyright Anthropic
  policy: summarize
  kind: report
  notes: >-
    Published 2026-01-29, paper arXiv 2601.20245. RCT with 52 mostly junior engineers learning the Trio library; AI
    group averaged 50% on a concept quiz versus 67% (d = 0.738, p = 0.01); time difference not significant;
    conceptual inquiry and generation-then-comprehension patterns scored highest.

- id: e2-spracklen-2024-package-hallucination
  title: "We Have a Package for You! A Comprehensive Analysis of Package Hallucinations by Code Generating LLMs (Spracklen et al., 2024)"
  author: Joseph Spracklen, Raveen Wijewickrama, A H M Nazmus Sakib, Anindya Maiti, Bimal Viswanath, Murtuza Jadliwala
  url: https://arxiv.org/abs/2406.10279
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: 16 models, 576,000 samples; hallucinated packages at least 5.2% on average for commercial models and 21.7% for open-source models. USENIX Security 2025.

