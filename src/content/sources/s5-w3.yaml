# All URLs checked 2026-11-11.

# ---------- Papers (summarize) ----------
- id: hu-2021-lora
  title: "LoRA: Low-Rank Adaptation of Large Language Models (Hu et al., 2021)"
  author: Edward J. Hu, Yelong Shen, Phillip Wallis, Zeyuan Allen-Zhu, Yuanzhi Li, Shean Wang, Lu Wang, Weizhu Chen
  url: https://arxiv.org/abs/2106.09685
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    h = W0 x + BAx, A Gaussian and B zero at init, update scaled by alpha/r (alpha set to the first r tried, not tuned).
    Adapted only attention weights; GPT-3 175B checkpoint 350GB to 35MB with r=4 on Wq and Wv; training VRAM 1.2TB to
    350GB; r=1 sufficed for Wq and Wv on their datasets; Delta W amplifies directions not emphasized in W (factor about
    21.5 at r=4); merge W0 + BA for no inference latency.

- id: aghajanyan-2020-intrinsic
  title: Intrinsic Dimensionality Explains the Effectiveness of Language Model Fine-Tuning (Aghajanyan et al., 2020)
  author: Armen Aghajanyan, Luke Zettlemoyer, Sonal Gupta
  url: https://arxiv.org/abs/2012.13255
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    200 trainable parameters randomly projected into the full space reach 90 percent of full fine-tuning performance
    for RoBERTa on MRPC; pretraining lowers intrinsic dimension; larger models tend to have lower intrinsic dimension.

- id: li-2018-intrinsic-dimension
  title: Measuring the Intrinsic Dimension of Objective Landscapes (Li et al., 2018)
  author: Chunyuan Li, Heerad Farkhoor, Rosanne Liu, Jason Yosinski
  url: https://arxiv.org/abs/1804.08838
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Defines intrinsic dimension by training in a random low-dimensional subspace; the method Aghajanyan et al. build on.

- id: dettmers-2023-qlora
  title: "QLoRA: Efficient Finetuning of Quantized LLMs (Dettmers et al., 2023)"
  author: Tim Dettmers, Artidoro Pagnoni, Ari Holtzman, Luke Zettlemoyer
  url: https://arxiv.org/abs/2305.14314
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    4-bit NormalFloat (quantile quantization of N(0,1), blocksize 64), double quantization (0.5 to 0.127 bits per
    parameter for constants, about 3 GB on a 65B model), paged optimizers via NVIDIA unified memory, BF16 compute.
    65B finetuning from more than 780GB to under 48GB. LoRA on all linear layers needed to match 16-bit full
    finetuning. Guanaco 99.3 percent of ChatGPT on the Vicuna benchmark as judged by GPT-4.

- id: biderman-2024-lora-forgets
  title: LoRA Learns Less and Forgets Less (Biderman et al., 2024)
  author: Dan Biderman, Jacob Portes, Jose Javier Gonzalez Ortiz, and colleagues (Columbia, Databricks Mosaic AI)
  url: https://arxiv.org/abs/2405.09673
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    TMLR 2024. Code and math, instruction finetuning (about 100K pairs) and continued pretraining (20B tokens): LoRA
    substantially underperforms full finetuning but better preserves out-of-domain abilities; full finetuning learns
    perturbations of rank 10 to 100 times typical LoRA ranks.

- id: kirkpatrick-2017-ewc
  title: Overcoming catastrophic forgetting in neural networks (Kirkpatrick et al., 2017)
  author: James Kirkpatrick, Razvan Pascanu, and colleagues (DeepMind)
  url: https://arxiv.org/abs/1612.00796
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Published in PNAS 2017. Elastic weight consolidation; a standard reference for catastrophic forgetting.

- id: luo-2023-forgetting
  title: An Empirical Study of Catastrophic Forgetting in Large Language Models During Continual Fine-tuning (Luo et al., 2023)
  author: Yun Luo, Zhen Yang, and colleagues
  url: https://arxiv.org/abs/2308.08747
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    1B to 7B models (BLOOMZ, mT0): forgetting observed across the range during continual instruction tuning, more
    severe with scale in that range; general instruction tuning beforehand reduced it.

- id: shi-2024-loss-over-instructions
  title: Instruction Tuning With Loss Over Instructions (Shi et al., 2024)
  author: Zhengyan Shi, Adam X. Yang, Bin Wu, Laurence Aitchison, Emine Yilmaz, Aldo Lipani
  url: https://arxiv.org/abs/2405.14394
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    NeurIPS 2024. Computing loss on instructions as well as outputs often helped, most when instructions are long
    relative to outputs and when training data is small; attributed to less overfitting.

# ---------- Practitioner and lab writing (summarize) ----------
- id: thinking-machines-lora
  title: LoRA Without Regret
  author: John Schulman and colleagues (Thinking Machines Lab)
  url: https://thinkingmachines.ai/blog/lora/
  license: Copyright Thinking Machines Lab
  policy: summarize
  kind: blog
  notes: >-
    September 29, 2025. LoRA matched full fine-tuning on small-to-medium SFT datasets and in RL; underperformed when the
    dataset exceeded adapter capacity; all layers (especially MLP) beat attention-only; optimal LoRA learning rate about
    10x full fine-tuning; less tolerant of large batches.

- id: fastai-learning-jumps
  title: Can LLMs learn from a single example?
  author: Jeremy Howard and Jonathan Whitaker (fast.ai)
  url: https://www.fast.ai/posts/2023-09-04-learning-jumps/
  license: Copyright fast.ai
  policy: summarize
  kind: blog
  notes: >-
    September 2023. Training loss drops sharply at each epoch boundary when fine-tuning LLMs; validation loss rose
    from overconfidence while validation accuracy still improved. Framed by the authors as early work.

