# ---------- Technical writing ----------
- id: google-tech-writing
  title: Technical Writing courses (Technical Writing One and Two)
  author: Google for Developers
  url: https://developers.google.com/tech-writing
  license: CC BY 4.0 (text); Apache 2.0 (code samples)
  licenseUrl: https://creativecommons.org/licenses/by/4.0/
  policy: adapt
  kind: course
  notes: Free self-paced courses for engineers. License stated in the page footer, checked 2026-11-11.

- id: google-tw-audience
  title: "Audience (Technical Writing One)"
  author: Google for Developers
  url: https://developers.google.com/tech-writing/one/audience
  license: CC BY 4.0 (text); Apache 2.0 (code samples)
  licenseUrl: https://creativecommons.org/licenses/by/4.0/
  policy: adapt
  kind: course
  notes: Define the audience by role and proximity; the curse of knowledge; good docs supply what the reader needs minus what they already know.

- id: google-tw-documents
  title: "Documents (Technical Writing One)"
  author: Google for Developers
  url: https://developers.google.com/tech-writing/one/documents
  license: CC BY 4.0 (text); Apache 2.0 (code samples)
  licenseUrl: https://creativecommons.org/licenses/by/4.0/
  policy: adapt
  kind: course
  notes: State scope and non-scope, state the audience, summarize key points at the start, organize sections around readers' needs.

- id: google-tw-illustrations
  title: "Illustrating (Technical Writing Two)"
  author: Google for Developers
  url: https://developers.google.com/tech-writing/two/illustrations
  license: CC BY 4.0 (text); Apache 2.0 (code samples)
  licenseUrl: https://creativecommons.org/licenses/by/4.0/
  policy: adapt
  kind: course
  notes: Write the caption first, limit the information in one drawing, show an overview before subsystem detail, focus the reader's eye.

# ---------- Design docs and proposals ----------
- id: ubl-2020-design-docs
  title: Design Docs at Google
  author: Malte Ubl
  url: https://www.industrialempathy.com/posts/design-docs-at-google/
  license: Copyright Malte Ubl
  policy: summarize
  kind: blog
  notes: >-
    July 2020. Sections: context and scope, goals and non-goals, the design, alternatives considered, cross-cutting
    concerns (security, privacy, observability). Trade-offs are the point; review catches issues while change is cheap.

- id: python-pep-1
  title: "PEP 1: PEP Purpose and Guidelines"
  author: Python Software Foundation (Warsaw, Hylton, Goodger, Coghlan)
  url: https://peps.python.org/pep-0001/
  license: Public domain or CC0 1.0
  licenseUrl: https://creativecommons.org/publicdomain/zero/1.0/
  policy: adapt
  kind: docs
  notes: A long-lived public design-proposal format. Sections include Abstract, Motivation, Rationale, Security Implications, Rejected Ideas, and Open Issues.

# ---------- Scoping, metrics, and risk ----------
- id: zinkevich-rules-of-ml
  title: "Rules of Machine Learning: Best Practices for ML Engineering"
  author: Martin Zinkevich (Google)
  url: https://developers.google.com/machine-learning/guides/rules-of-ml
  license: CC BY 4.0 (text); Apache 2.0 (code samples)
  licenseUrl: https://creativecommons.org/licenses/by/4.0/
  policy: adapt
  kind: docs
  notes: Rule 1, don't be afraid to launch without ML; Rule 2, design and implement metrics first; Rule 13, a simple, observable, attributable first objective.

- id: google-ml-problem-framing
  title: "Framing an ML problem (Introduction to Machine Learning Problem Framing)"
  author: Google for Developers
  url: https://developers.google.com/machine-learning/problem-framing/ml-framing
  license: CC BY 4.0 (text); Apache 2.0 (code samples)
  licenseUrl: https://creativecommons.org/licenses/by/4.0/
  policy: adapt
  kind: course
  notes: Ideal outcome stated independently of the model; product success and failure metrics separate from model metrics; check that a better model would actually move the success metric.

- id: klein-2007-premortem
  title: Performing a Project Premortem (Harvard Business Review, September 2007)
  author: Gary Klein
  url: https://hbr.org/2007/09/performing-a-project-premortem
  license: Copyright Harvard Business Publishing
  policy: summarize
  kind: blog
  notes: Assume the project has already failed and have each team member write down plausible reasons why, before the work starts.
