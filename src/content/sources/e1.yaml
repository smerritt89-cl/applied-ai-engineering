# ---------- Karpathy's code (MIT) ----------
- id: karpathy-micrograd-repo
  title: micrograd, a tiny scalar-valued autograd engine
  author: Andrej Karpathy
  url: https://github.com/karpathy/micrograd
  license: MIT
  licenseUrl: https://github.com/karpathy/micrograd/blob/master/LICENSE
  policy: adapt
  kind: repo
  notes: About 100 lines of engine plus about 50 lines of neural-net library, per its README.

- id: karpathy-makemore-repo
  title: makemore, character-level language models from bigrams to transformers
  author: Andrej Karpathy
  url: https://github.com/karpathy/makemore
  license: MIT
  licenseUrl: https://github.com/karpathy/makemore/blob/master/LICENSE
  policy: adapt
  kind: repo
  notes: Includes names.txt (32,033 names from ssa.gov for 2018, per the README).

- id: karpathy-ng-video-lecture
  title: nanogpt-lecture, the code built in "Let's build GPT"
  author: Andrej Karpathy
  url: https://github.com/karpathy/ng-video-lecture
  license: MIT (stated in the README)
  policy: adapt
  kind: repo
  notes: gpt.py hyperparameters (block_size 256, n_embd 384, 6 heads, 6 layers, dropout 0.2) and a 90/10 train/val split. README notes the video skipped weight initialization; see nanoGPT model.py.

- id: karpathy-nanogpt-repo
  title: nanoGPT
  author: Andrej Karpathy
  url: https://github.com/karpathy/nanoGPT
  license: MIT
  licenseUrl: https://github.com/karpathy/nanoGPT/blob/master/LICENSE
  policy: adapt
  kind: repo
  notes: >-
    README (checked 2026-11-11) marks the repo as old and deprecated as of Nov 2025, pointing to nanochat, but keeps it up.
    Its shakespeare_char quick start reports best val loss 1.4697 in about 3 minutes on one A100, and a CPU config
    (4 layers, 4 heads, 128 embd, block 64) reaching about 1.88.

- id: karpathy-minbpe-repo
  title: minbpe, minimal byte-level Byte Pair Encoding
  author: Andrej Karpathy
  url: https://github.com/karpathy/minbpe
  license: MIT
  licenseUrl: https://github.com/karpathy/minbpe/blob/master/LICENSE
  policy: adapt
  kind: repo
  notes: The README's "aaabdaaabac" example with 3 merges encodes to [258, 100, 258, 97, 99]. exercise.md holds the staged tokenizer exercise.

- id: openai-tiktoken
  title: tiktoken, a fast BPE tokenizer for OpenAI models
  author: OpenAI
  url: https://github.com/openai/tiktoken
  license: MIT
  policy: summarize
  kind: repo

