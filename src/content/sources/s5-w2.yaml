# ---------------------------------------------------------------- Papers

- id: gekhman-2024-new-knowledge
  title: "Does Fine-Tuning LLMs on New Knowledge Encourage Hallucinations? (Gekhman et al., EMNLP 2024)"
  author: Zorik Gekhman, Gal Yona, Roee Aharoni, Matan Eyal, Amir Feder, Roi Reichart, Jonathan Herzig
  url: https://arxiv.org/abs/2405.05904
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    Checked 2026-11-11. PaLM 2-S, closed-book QA on EntityQuestions. Unknown examples are fitted slower and, once
    fitted, increase hallucination roughly linearly; early stopping and filtering Unknown examples reduce the harm;
    MaybeKnown examples were most useful. Single model and task, as the authors note.

- id: ovadia-2023-ft-vs-rag
  title: "Fine-Tuning or Retrieval? Comparing Knowledge Injection in LLMs (Ovadia et al., 2023)"
  author: Oded Ovadia, Menachem Brief, Moshik Mishaeli, Oren Elisha
  url: https://arxiv.org/abs/2312.05934
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    Checked 2026-11-11 (v3, January 2024). Unsupervised fine-tuning on raw text vs RAG for Llama2-7B, Mistral-7B,
    Orca2-7B on MMLU subsets and a current-events set; RAG consistently better; paraphrase augmentation helps
    fine-tuning; RAG plus fine-tuning did not beat RAG alone in their setup.

- id: zhou-2023-lima
  title: "LIMA: Less Is More for Alignment (Zhou et al., 2023)"
  author: Chunting Zhou, Pengfei Liu, Puxin Xu, Srini Iyer, and colleagues (Meta AI and others)
  url: https://arxiv.org/abs/2305.11206
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: 65B LLaMa fine-tuned on 1,000 curated examples; argues most knowledge is learned in pretraining.

- id: gudibande-2023-imitation
  title: "The False Promise of Imitating Proprietary LLMs (Gudibande et al., 2023)"
  author: Arnav Gudibande, Eric Wallace, Charlie Snell, Xinyang Geng, Hao Liu, Pieter Abbeel, Sergey Levine, Dawn Song
  url: https://arxiv.org/abs/2305.15717
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Imitation models copied ChatGPT's style but not its factuality; crowd raters were fooled, targeted evals were not.

- id: zhao-2024-lora-land
  title: "LoRA Land: 310 Fine-tuned LLMs that Rival GPT-4, A Technical Report (Zhao et al., 2024)"
  author: Justin Zhao, Timothy Wang, Wael Abid, and colleagues (Predibase)
  url: https://arxiv.org/abs/2405.00732
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: >-
    10 base models x 31 tasks; 4-bit LoRA models beat their base by 34 points and GPT-4 by 10 points on average on
    those narrow tasks. A vendor technical report, so treat as evidence for narrow tasks, not a general ranking.

- id: wang-2022-self-instruct
  title: "Self-Instruct: Aligning Language Models with Self-Generated Instructions (Wang et al., 2022)"
  author: Yizhong Wang, Yeganeh Kordi, Swaroop Mishra, and colleagues
  url: https://arxiv.org/abs/2212.10560
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper

- id: carlini-2021-extraction
  title: "Extracting Training Data from Large Language Models (Carlini et al., 2021)"
  author: Nicholas Carlini, Florian Tramer, Eric Wallace, and colleagues
  url: https://arxiv.org/abs/2012.07805
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Extracted verbatim training sequences, including PII, from GPT-2; some appeared in only one training document.

- id: northcutt-2021-label-errors
  title: "Pervasive Label Errors in Test Sets Destabilize Machine Learning Benchmarks (Northcutt et al., NeurIPS 2021)"
  author: Curtis G. Northcutt, Anish Athalye, Jonas Mueller
  url: https://arxiv.org/abs/2103.14749
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: At least 3.3 percent label errors on average across 10 test sets; corrected labels can flip model rankings.

- id: kapoor-2022-leakage
  title: "Leakage and the Reproducibility Crisis in ML-based Science (Kapoor and Narayanan, 2022)"
  author: Sayash Kapoor and Arvind Narayanan
  url: https://arxiv.org/abs/2207.07048
  license: arXiv non-exclusive license
  policy: summarize
  kind: paper
  notes: Survey finding leakage errors affecting 329 papers across 17 fields; a taxonomy of 8 leakage types.

