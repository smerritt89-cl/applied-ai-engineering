id: s5
number: 5
title: Open Models & Fine-Tuning
tagline: Hugging Face, running models locally, LoRA, and when fine-tuning beats prompting.
summary: >-
  Work with open-weight models directly. You run models locally, learn what fine-tuning changes and what it doesn't,
  build a training set, fine-tune a small model with LoRA, and benchmark it honestly against a frontier model on
  cost, latency, and accuracy.
status: available
estWeeks: 5
estHours: 45
accent: var(--s5)
project: s5-project
exam: s5-exam
outcomes:
  - Navigate the Hugging Face ecosystem and run open models locally
  - Decide between prompting, RAG, and fine-tuning using cost and quality evidence
  - Build and clean a supervised fine-tuning dataset
  - Fine-tune with LoRA/QLoRA and benchmark against a frontier model
weeks:
  - { week: 1, title: "The open model ecosystem", summary: "Hugging Face, model cards, licenses, and local inference." }
  - { week: 2, title: "Prompt, retrieve, or train?", summary: "What fine-tuning changes and how to build a dataset." }
  - { week: 3, title: "Parameter-efficient fine-tuning", summary: "LoRA and QLoRA with PEFT and TRL." }
  - { week: 4, title: "Honest benchmarking", summary: "Comparing your model to a frontier model." }
  - { week: 5, title: "Project week", summary: "Fine-tune an extraction model and publish the benchmark." }
