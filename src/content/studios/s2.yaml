id: s2
number: 2
title: Retrieval & RAG
tagline: Embeddings, chunking, vector search, hybrid retrieval, and reranking.
summary: >-
  Give a model the right information at the right time. You build retrieval from first principles (embeddings and
  similarity), then make it good: chunking strategies, vector databases, hybrid keyword plus semantic search,
  reranking, and answers that cite their sources. You finish with Q&A over a real document set.
status: available
estWeeks: 4
estHours: 38
accent: var(--s2)
project: s2-project
exam: s2-exam
outcomes:
  - Explain embeddings and similarity metrics and choose an embedding model with evidence
  - Design a chunking and ingestion pipeline for messy real documents
  - Build hybrid search with reranking and measure retrieval quality (recall@k, MRR)
  - Produce grounded answers with citations and detect when retrieval failed
weeks:
  - { week: 1, title: "Embeddings and similarity", summary: "Vectors that capture meaning and how to search them." }
  - { week: 2, title: "Ingestion, chunking, and vector stores", summary: "Turning documents into searchable pieces." }
  - { week: 3, title: "Hybrid search and reranking", summary: "Combining keyword and semantic search, then reordering." }
  - { week: 4, title: "Grounded answers", summary: "Citations, abstention, failure modes, and the project." }
