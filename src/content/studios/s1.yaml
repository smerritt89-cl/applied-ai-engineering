id: s1
number: 1
title: LLM App Fundamentals
tagline: APIs, prompting, structured outputs, and tool calling, from first call to working tool.
summary: >-
  How language models behave from a builder's point of view, and the four building blocks of every LLM application:
  calling the API well, writing prompts you can test, getting structured data you can trust, and letting the model
  call your code. You finish with a tool that turns meeting transcripts into checked, structured action items.
status: available
estWeeks: 4
estHours: 36
accent: var(--s1)
project: s1-project
exam: s1-exam
outcomes:
  - Explain tokens, context windows, and sampling well enough to predict cost, latency, and failure modes
  - Call a frontier model API with streaming, retries, and usage tracking, and choose a model for a task using evidence
  - Write, test, and iterate on prompts as versioned artifacts instead of one-off strings
  - Get schema-valid structured output and verify it before your code relies on it
  - Implement the tool-calling loop, design tools a model can use well, and gate side effects behind checks
weeks:
  - week: 1
    title: How models work, and your first calls
    summary: Tokens, sampling, the Messages API, and how to choose among Claude, GPT, Gemini, Grok, and open models.
  - week: 2
    title: Prompting as engineering
    summary: Clear instructions, examples, reasoning, and a test-driven way to iterate.
  - week: 3
    title: Structured outputs you can trust
    summary: Schemas, validation, and defenses against confident-but-wrong output.
  - week: 4
    title: Tool calling
    summary: The tool loop, tool design, approvals for side effects, and the studio project.
