id: e2
number: 9
kind: elective
title: Working with Coding Agents
tagline: From relying on Claude Code to directing it. Context, verification, and review.
summary: >-
  Most engineers now work alongside coding agents. This elective turns that into a deliberate practice: how agents
  like Claude Code work under the hood, how to give them context (project memory, skills, subagents), how to verify
  their work with tests and review, and how to spot the tasks where they shouldn't be trusted.
status: available
estWeeks: 3
estHours: 24
accent: var(--elective)
project: e2-project
outcomes:
  - Explain how a coding agent plans, uses tools, and manages context
  - Set up project context and verification loops so agent output is checked by default
  - Decide which tasks to delegate, to which model, with what review
weeks:
  - { week: 1, title: "How coding agents work", summary: "The agent loop, how agents are measured, and choosing the agent and model." }
  - { week: 2, title: "Giving agents context", summary: "Project memory, skills, subagents, hooks, MCP, and planning." }
  - { week: 3, title: "Verify, don't trust", summary: "Tests as the contract, reviewing agent code, and when not to delegate." }
