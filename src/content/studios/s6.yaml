id: s6
number: 6
title: Shipping to Production
tagline: Deployment, cost and latency, observability, and guardrails.
summary: >-
  Take an LLM system live and keep it healthy. You deploy with streaming and retries, cut cost and latency with
  caching, batching, and model routing, add tracing and logging you can actually debug with, and put guardrails and
  security controls around inputs and outputs. You finish by shipping your best earlier project with a cost dashboard.
status: available
estWeeks: 4
estHours: 40
accent: var(--s6)
project: s6-project
exam: s6-exam
outcomes:
  - Deploy an LLM service with streaming, timeouts, retries, and graceful degradation
  - Reduce cost and latency with caching, batching, and routing, and measure the effect
  - Instrument an LLM system with traces, logs, and cost metrics
  - Apply guardrails and the OWASP LLM Top 10 to a real system
weeks:
  - { week: 1, title: Deployment, summary: Serving patterns, streaming, and resilience. }
  - { week: 2, title: Cost and latency, summary: Caching, batching, routing, and budgets. }
  - { week: 3, title: Observability, summary: Tracing, logging, and dashboards for LLM systems. }
  - { week: 4, title: Guardrails and security, summary: Input and output controls, OWASP LLM Top 10, incident response. }
