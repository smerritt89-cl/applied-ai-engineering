id: capstone
number: 7
kind: capstone
title: Capstone
tagline: One system that combines retrieval, agents, and evals, with a public write-up and defense.
summary: >-
  Design, build, evaluate, and ship a system that combines what you've learned: retrieval, an agent with tools, and
  an evaluation suite that proves it works. You finish with a written report, eval results, and a recorded demo.
status: available
estWeeks: 6
estHours: 70
accent: var(--capstone)
project: capstone-project
outcomes:
  - Scope an AI system against a real user need and success metrics
  - Integrate retrieval, agents, and evaluations into one production-grade system
  - Defend design decisions with evidence in writing and in a recorded demo
weeks:
  - { week: 1, title: "Scope and eval set", summary: "Pick a real problem, define success, and build the eval set before code." }
  - { week: 2, title: "Retrieval", summary: "Ingest, index, and measure retrieval." }
  - { week: 3, title: "Agent and tools", summary: "Add the agent, its tools, and guardrails." }
  - { week: 4, title: "Evals and iteration", summary: "Calibrate the judge and improve with measured changes." }
  - { week: 5, title: "Production hardening", summary: "Deploy with observability, cost tracking, and security checks." }
  - { week: 6, title: "Write-up and defense", summary: "Report, demo, and defend your decisions." }
