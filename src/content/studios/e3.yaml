id: e3
number: 10
kind: elective
title: Frontier Perspectives
tagline: What industry leaders are claiming now, and how to weigh claims against evidence.
summary: >-
  A reading-and-discussion elective on the current debates: scaling and its limits, timelines to more capable
  systems, agents and the future of software work, safety and alignment, and the economics of AI. Every claim is
  paired with the evidence for and against it, and you practice evaluating claims and benchmarks yourself.
status: available
estWeeks: 3
estHours: 20
accent: var(--elective)
project: e3-project
outcomes:
  - Summarize the main current positions of AI lab leaders and prominent skeptics, with sources
  - Read a benchmark result critically (contamination, saturation, what it actually measures)
  - Write a short, evidence-weighted assessment of a public AI claim
weeks:
  - { week: 1, title: "Capabilities and how they are measured", summary: "Scaling, benchmarks, and which model fits which job." }
  - { week: 2, title: "The big claims", summary: "Lab leaders, skeptics, and the evidence on AI and work." }
  - { week: 3, title: "Safety, governance, and judgment", summary: "Safety frameworks, regulation, and how to evaluate any claim." }
