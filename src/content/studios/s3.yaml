id: s3
number: 3
title: Evaluation
tagline: Test sets, LLM-as-judge, and regression testing; the checks and balances behind every AI system.
summary: >-
  The discipline that separates demos from products. You learn error analysis, build test sets, write code-based and
  model-based graders, calibrate an LLM judge against human labels, compare prompts and models with real statistics,
  and wire evals into CI so regressions are caught before users see them.
status: available
estWeeks: 4
estHours: 36
accent: var(--s3)
project: s3-project
exam: s3-exam
outcomes:
  - Run error analysis on real outputs and turn failure modes into test cases
  - Build code-based, model-based, and human graders and know when each is trustworthy
  - Calibrate an LLM judge against human labels and report agreement
  - Compare two systems with confidence intervals instead of anecdotes, and gate releases on evals
weeks:
  - { week: 1, title: "Why evals, and error analysis", summary: "Look at the data before you measure it." }
  - { week: 2, title: "Graders", summary: "Assertions, LLM-as-judge, and calibrating the judge." }
  - { week: 3, title: "Comparing systems", summary: "Statistics for model and prompt comparisons; regression testing." }
  - { week: 4, title: "Eval-driven development", summary: "Human review loops, CI gates, and the project." }
