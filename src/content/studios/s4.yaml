id: s4
number: 4
title: Agents & MCP
tagline: Workflows versus agents, the agent loop, building MCP servers, and keeping agents safe.
summary: >-
  When a fixed pipeline isn't enough, let the model decide the next step, with guardrails. You learn the common agent
  patterns, design tools and context for long tasks, build Model Context Protocol servers, and add permissions,
  human approval, and prompt-injection defenses. You finish with an agent that automates a real PM workflow.
status: available
estWeeks: 5
estHours: 45
accent: var(--s4)
project: s4-project
exam: s4-exam
outcomes:
  - Choose between a single call, a workflow, and an agent, and justify the choice
  - Build an agent loop with well-designed tools and managed context
  - Build and test an MCP server that exposes tools and resources
  - Constrain an agent with permissions, approvals, sandboxing, and injection defenses
weeks:
  - { week: 1, title: "Workflows and agents", summary: "Patterns from prompt chaining to orchestrator-workers." }
  - { week: 2, title: "The agent loop", summary: "Tools, context management, memory, and stopping." }
  - { week: 3, title: "Model Context Protocol", summary: "Servers, clients, tools, resources, and prompts." }
  - { week: 4, title: "Agents you can trust", summary: "Permissions, human-in-the-loop, sandboxing, and prompt injection." }
  - { week: 5, title: "Project week", summary: "Build and evaluate the PM workflow agent." }
