id: e1
number: 8
kind: elective
title: "Let's Build GPT"
tagline: Optional deep dive with Karpathy's Zero to Hero series. Build a transformer from scratch.
summary: >-
  For the mathematically curious. Follow Andrej Karpathy's Neural Networks Zero to Hero series to build
  backpropagation, a character-level language model, and finally a GPT, in code you write yourself.
status: available
estWeeks: 4
estHours: 30
accent: var(--elective)
project: e1-project
outcomes:
  - Implement backpropagation from scratch and explain it with calculus
  - Build and train a small transformer language model
weeks:
  - { week: 1, title: "Backpropagation from scratch", summary: "Build micrograd and the chain rule in code." }
  - { week: 2, title: "Language models from counts to MLPs", summary: "The bigram model and the MLP language model." }
  - { week: 3, title: "Training deep networks", summary: "Activations, BatchNorm, and backprop by hand." }
  - { week: 4, title: "Transformers and tokenizers", summary: "Build GPT and the GPT tokenizer." }
